version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - node -e "const fs=require('fs');const keys=Object.keys(process.env).filter(k=>/^(NEXT_PUBLIC_|APP_AWS_REGION|BEDROCK_|POLLY_|DYNAMODB_|SNS_)/.test(k));fs.writeFileSync('.env.production',keys.map(k=>k+'='+process.env[k]).join('\n')+'\n');"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
